<svg xmlns="http://www.w3.org/2000/svg" width="168" height="168" viewBox="0 0 168 168" role="img" aria-label="Paper Sketch">
  <!-- Paper Sketch のロゴ: Hub と同じ地に、縦書きの便箋。ルビの点は Hub のグラデーション -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FC6C0"/><stop offset=".5" stop-color="#4F7DF3"/><stop offset="1" stop-color="#8D6CF2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1E29"/><stop offset="1" stop-color="#090A0E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".7">
      <stop offset="0" stop-color="#6E7CF5" stop-opacity=".55"/><stop offset="1" stop-color="#6E7CF5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="160" height="160" rx="38" fill="url(#body)"/>
  <rect x="4" y="4" width="160" height="110" rx="38" fill="url(#glow)"/>
  <rect x="4.5" y="4.5" width="159" height="159" rx="37.5" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
  <rect x="44" y="34" width="80" height="100" rx="10" fill="none" stroke="#ECEEF3" stroke-opacity=".92" stroke-width="6"/>
  <path d="M104 50v68M84 50v48M64 50v28" fill="none" stroke="#ECEEF3" stroke-opacity=".92" stroke-width="6" stroke-linecap="round"/>
  <g fill="url(#bar)"><circle cx="115" cy="52" r="3.6"/><circle cx="115" cy="62" r="3.6"/><circle cx="115" cy="72" r="3.6"/></g>
</svg>
